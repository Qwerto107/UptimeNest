name: uptimenest

services:
  uptimenest:
    container_name: uptimenest
    image: ghcr.io/qwerto107/uptimenest:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      UPTIMENEST_ADDRESS: 0.0.0.0:8090
      UPTIMENEST_DB_TYPE: ${UPTIMENEST_DB_TYPE:-sqlite}
      UPTIMENEST_DB_DSN: ${UPTIMENEST_DB_DSN:-/app/data/uptimenest.db}
      UPTIMENEST_COOKIE_SECURE: "${UPTIMENEST_COOKIE_SECURE:-false}"
      UPTIMENEST_SECRET_KEY_FILE: ${UPTIMENEST_SECRET_KEY_FILE:-/app/data/secret.key}
    volumes:
      - ./data:/app/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test: ["CMD", "/app/uptimenest", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
